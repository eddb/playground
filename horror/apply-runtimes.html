<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Horror Month — apply runtimes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    background: #161412; color: #F6EAD2;
    font-family: "Courier New", Courier, monospace;
    max-width: 640px; margin-left: auto; margin-right: auto;
  }
  h1 { font-size: 1.1rem; font-weight: normal; margin: 0 0 4px; }
  p.hint { color: #A69A87; font-size: 0.82rem; margin: 0 0 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(246,234,210,0.12); vertical-align: top; }
  th { color: #A69A87; font-weight: normal; font-size: 0.75rem; text-transform: uppercase; }
  .status { font-size: 0.78rem; }
  .status.matched { color: #5F83A0; }
  .status.applied { color: #7FA66B; }
  .status.missing { color: #D9503F; }
  .status.skipped { color: #A69A87; }
  button {
    background: #211E1A; color: #F6EAD2;
    border: 1px solid rgba(246,234,210,0.25);
    border-radius: 4px; padding: 6px 12px;
    font-family: inherit; font-size: 0.78rem; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #applyBtn { margin: 18px 0; padding: 10px 18px; font-size: 0.9rem; display: block; }
  .choice-row button { margin-right: 6px; }
  #log { font-size: 0.78rem; color: #A69A87; white-space: pre-wrap; margin-top: 16px; }
</style>
</head>
<body>
<h1>Horror Month — apply runtimes</h1>
<p class="hint">Matches titles below against the live movie list and writes the runtime field. Nothing is written until you click Apply. "The Hills Have Eyes" has two possible runtimes -- pick one with its own button.</p>

<table id="rows"></table>
<button id="applyBtn">Apply all matched runtimes</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";
  var firebaseConfig = {
    apiKey: "AIzaSyDrbLHnvhhu_XYcyXO2Om8fN4bff8QkxOo",
    authDomain: "tear-7c4ae.firebaseapp.com",
    databaseURL: "https://tear-7c4ae-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tear-7c4ae",
    storageBucket: "tear-7c4ae.firebasestorage.app",
    messagingSenderId: "1001513131517",
    appId: "1:1001513131517:web:f5e3911cf1e06b68a70d94"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  // Unambiguous title -> minutes
  var RUNTIMES = [
    ["Bring Her Back (2025)", 104],
    ["Dawn of the Dead (1978)", 127],
    ["Hereditary (2018)", 127],
    ["Invasion of the Body Snatchers (1978)", 115],
    ["It Follows (2014)", 100],
    ["Let The Right One In (2008)", 114],
    ["Paranormal Activity (2007)", 86],
    ["Sinners (2025)", 137],
    ["The Conjuring (2013)", 112],
    ["The Silence of the Lambs (1991)", 118],
    ["The Thing (1982)", 109],
    ["The Witch (2015)", 92],
    ["Train to Busan (2016)", 118],
    ["Weapons (2025)", 128],
    ["Winnie the Pooh: Blood and Honey (2023)", 84]
  ];
  var AMBIGUOUS_TITLE = "The Hills Have Eyes";
  var AMBIGUOUS_OPTIONS = [
    { label: "1977 original -- 89 min", minutes: 89 },
    { label: "2006 remake -- 107 min", minutes: 107 }
  ];

  function normalize(title){
    return String(title || "").trim().toLowerCase()
      .replace(/\s*\(\d{4}\)\s*$/, "")
      .replace(/&/g, "and")
      .replace(/\s+/g, " ")
      .trim();
  }

  var rowsEl = document.getElementById("rows");
  var logEl = document.getElementById("log");
  var applyBtn = document.getElementById("applyBtn");
  var liveMovies = {}; // normalized title -> {id, title, runtime}

  function log(msg){
    logEl.textContent += msg + "\n";
  }

  function findMatch(refTitle){
    var norm = normalize(refTitle);
    for (var key in liveMovies){
      if (key === norm) return liveMovies[key];
    }
    return null;
  }

  function renderRows(){
    var html = "<tr><th>Title</th><th>Runtime</th><th>Match</th></tr>";
    RUNTIMES.forEach(function(entry){
      var title = entry[0], minutes = entry[1];
      var match = findMatch(title);
      html += "<tr data-title=\"" + title.replace(/"/g, "&quot;") + "\">" +
        "<td>" + title + "</td>" +
        "<td>" + minutes + " min</td>" +
        "<td class=\"status " + (match ? "matched" : "missing") + "\">" +
          (match ? ("found: \"" + match.title + "\"" + (match.runtime != null ? " (already has " + match.runtime + "m)" : "")) : "no match in live list") +
        "</td>" +
      "</tr>";
    });

    var ambigMatch = findMatch(AMBIGUOUS_TITLE);
    html += "<tr><td>" + AMBIGUOUS_TITLE + "</td><td colspan=\"2\">";
    if (ambigMatch){
      html += "found: \"" + ambigMatch.title + "\"" + (ambigMatch.runtime != null ? " (already has " + ambigMatch.runtime + "m)" : "") +
        "<div class=\"choice-row\" style=\"margin-top:6px\">" +
        AMBIGUOUS_OPTIONS.map(function(o){
          return '<button data-ambig-minutes="' + o.minutes + '">' + o.label + '</button>';
        }).join("") +
        "</div>";
    } else {
      html += '<span class="status missing">no match in live list</span>';
    }
    html += "</td></tr>";

    rowsEl.innerHTML = html;

    rowsEl.querySelectorAll("[data-ambig-minutes]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var minutes = Number(btn.dataset.ambigMinutes);
        db.ref("horror/movies/" + ambigMatch.id).update({ runtime: minutes }).then(function(){
          log("Applied " + minutes + "m to \"" + ambigMatch.title + "\"");
          btn.parentNode.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
        });
      });
    });
  }

  applyBtn.addEventListener("click", function(){
    applyBtn.disabled = true;
    var writes = [];
    RUNTIMES.forEach(function(entry){
      var title = entry[0], minutes = entry[1];
      var match = findMatch(title);
      if (match){
        writes.push(
          db.ref("horror/movies/" + match.id).update({ runtime: minutes }).then(function(){
            log("Applied " + minutes + "m to \"" + match.title + "\"");
          }).catch(function(err){
            log("FAILED \"" + title + "\": " + (err && err.message ? err.message : err));
          })
        );
      } else {
        log("Skipped (no match): \"" + title + "\"");
      }
    });
    Promise.all(writes).then(function(){
      log("Done.");
      applyBtn.textContent = "Applied";
    });
  });

  db.ref("horror/movies").once("value").then(function(snap){
    var val = snap.val() || {};
    Object.keys(val).forEach(function(id){
      var m = val[id];
      liveMovies[normalize(m.title)] = { id: id, title: m.title, runtime: m.runtime };
    });
    renderRows();
  }).catch(function(err){
    log("Could not load live movie list: " + (err && err.message ? err.message : err));
  });
})();
</script>
</body>
</html>
